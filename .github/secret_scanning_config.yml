# .github/secret_scanning_config.yml
# 
# This file documents intentional secret-like patterns used in tests.
# GitHub Secret Scanning will flag these; they are all FAKE tokens
# invented solely for testing redaction logic.
#
# When pushing, bypass each alert with reason: "It's used in tests"

# ── Documented patterns ───────────────────────────────────────
documented_test_patterns:
  - path: "tests/test_secret_redaction_corpus.py"
    reason: "Adversarial corpus for redaction testing"
    patterns:
      - "AWS Access Key (AKIA...) — fake, no real account"
      - "AWS Secret Key (assignment pattern) — fake value"
      - "GitHub PAT (ghp_...) — fake, no real repo"
      - "GitHub OAuth (gho_...) — fake"
      - "GitHub server token (ghs_...) — fake"
      - "Google API key (AIza...) — fake"
      - "Slack bot token (xoxb-...) — fake"
      - "Slack webhook URL — fake, non-existent team"
      - "Stripe secret (sk_live/sk_test_...) — fake"
      - "Stripe webhook secret (whsec_...) — fake"
      - "JWT (header.payload.signature) — standard test JWT"
      - "Bearer token — fake opaque string"
      - "PEM private keys (RSA/EC/generic) — fake test keys"
      - "Database URLs (postgres/mysql/mongodb/redis/amqp) — fake credentials"
      - "OpenAI key (sk-proj-/sk-...) — fake"
      - "Anthropic key (sk-ant-...) — fake"
      - "Generic secret assignments (password=, api_key=, etc.) — fake"

  - path: "tests/test_adversarial_benchmark.py"
    reason: "Adversarial prompts corpus (may contain secret-like strings in attack prompts)"

# ── Policy ────────────────────────────────────────────────────
policy:
  # NEVER commit real secrets to this repository
  real_secrets:
    - "Use environment variables (AGENTGUARD_* prefix)"
    - "Use GitHub Secrets for CI"
    - "Use vault/KMS for production"
  
  # All test secrets are syntactically valid but invented
  test_secrets:
    - "Must be clearly fake (EXAMPLE, FAKE markers, example.com domains)"
    - "No real account/resource exists behind them"
    - "Bypass GitHub with 'used in tests' reason"
