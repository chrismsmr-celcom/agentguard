name: Publish cerbere-ag (SDK) to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    # Ne se déclenche que pour les releases GitHub dont le tag commence par "sdk-v"
    # Ex: sdk-v0.2.0
    if: startsWith(github.event.release.tag_name, 'sdk-v')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: |
          python -m build

      - name: Smoke test built wheel
        run: |
          python -m pip install dist/*.whl
          python -c "import agentguard_sdk; print('cerbere-ag SDK import OK')"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Nécessite un Trusted Publisher configuré sur :
        # https://pypi.org/manage/project/cerbere-ag/settings/publishing/
        #
        # Le Trusted Publisher doit pointer vers :
        # - ce repository GitHub
        # - ce workflow
        #
        # Aucun token PyPI n'est nécessaire avec Trusted Publishing.
