name: Publish cerbere-ag (SDK) to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    # Ne se déclenche que pour les releases GitHub dont le tag commence par "sdk-v"
    # (ex: sdk-v0.2.0) — pour ne pas se confondre avec les releases du serveur MCP.
    if: startsWith(github.event.release.tag_name, 'sdk-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # requis pour le Trusted Publishing PyPI (pas de token à gérer)
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Run tests before publishing
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/ -q

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Nécessite un Trusted Publisher configuré sur https://pypi.org/manage/project/cerbere-ag/settings/publishing/
        # pointant vers ce repo + ce fichier de workflow.
        # Si tu préfères un token classique à la place :
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN_SDK }}
