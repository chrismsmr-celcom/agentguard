name: Database Backup

on:
  schedule:
    # Tous les jours à 3h UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      keep:
        description: 'Number of backups to keep'
        required: false
        default: '30'

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg[binary]
      
      - name: Install PostgreSQL client (for pg_dump)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      
      - name: Create backups directory
        run: mkdir -p backups
      
      - name: Run backup script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AGENTGUARD_DB_TYPE: ${{ secrets.AGENTGUARD_DB_TYPE || 'sqlite' }}
          AGENTGUARD_DB_PATH: ${{ secrets.AGENTGUARD_DB_PATH || '/tmp/agentguard.db' }}
        run: |
          python scripts/backup_db.py --dir backups --keep ${{ github.event.inputs.keep || '30' }}
      
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_number }}
          path: backups/
          retention-days: 30
