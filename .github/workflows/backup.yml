name: Database Backup

on:
  schedule:
    - cron: "0 3 * * *"  # tous les jours à 3h UTC
  workflow_dispatch: {}  # déclenchement manuel

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run backup
        env:
          AGENTGUARD_DB_TYPE: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backup_db.py --dir backups --keep 30

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentguard-backup-${{ github.run_id }}
          path: backups/
          retention-days: 90

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Backup failed!"
          echo "Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Optionnel : envoie une notification Slack/email/webhook
