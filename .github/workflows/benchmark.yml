name: Public Benchmark

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK (regex layer only — no ML deps, no API keys)
        run: pip install -e .
      - name: Run public benchmark (regex layer)
        run: python benchmarks/run_public_benchmark.py --layers regex
      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
