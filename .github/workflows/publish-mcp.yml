name: Publish cerbere-ag-mcp to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    # Ne se déclenche que pour les releases GitHub dont le tag commence par "mcp-v"
    # (ex: mcp-v0.1.0) — pour ne pas se confondre avec les releases du SDK.
    if: startsWith(github.event.release.tag_name, 'mcp-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # requis pour le Trusted Publishing PyPI (pas de token à gérer)
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        working-directory: mcp
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp/dist
        # Nécessite un Trusted Publisher configuré sur https://pypi.org/manage/account/publishing/
        # (le projet cerbere-ag-mcp n'existe pas encore sur PyPI : PyPI permet de déclarer
        # un "pending publisher" AVANT le premier publish — voir le guide ci-dessous).
        # Si tu préfères un token classique à la place :
        # with:
        #   packages-dir: mcp/dist
        #   password: ${{ secrets.PYPI_API_TOKEN_MCP }}
