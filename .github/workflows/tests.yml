name: Tests

# Tourne sur chaque push ET chaque pull request — c'est la PR qui doit être
# bloquée en cas d'échec (voir la configuration de branch protection dans
# le README associé), pas seulement un signal après coup sur main.
"on":
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          AGENTGUARD_API_KEY: ag-ci-test-key
          AGENTGUARD_ADMIN_SECRET: ci-admin-secret
          AGENTGUARD_DB_PATH: /tmp/ci_test.db
        run: |
          python -m pytest -v --tb=short

      - name: Verify all Python files compile
        run: |
          python -m py_compile *.py
