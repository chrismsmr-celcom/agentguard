name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]  # Test sur 2 versions Python
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        env:
          AGENTGUARD_API_KEY: ag-ci-test-key
          AGENTGUARD_ADMIN_SECRET: ci-admin-secret
          AGENTGUARD_DB_PATH: /tmp/ci_test.db
          AGENTGUARD_DB_TYPE: sqlite
        run: |
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=xml

      - name: Verify all Python files compile
        run: |
          python -m py_compile *.py
          python -m py_compile tests/*.py 2>/dev/null || true

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
