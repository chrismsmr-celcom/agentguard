services:
  - type: web
    name: agentguard-collector
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AGENTGUARD_ENV
        value: production
    healthCheckPath: /api/metrics
