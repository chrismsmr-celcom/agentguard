services:
  - type: web
    name: agentguard-collector
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AGENTGUARD_DB_TYPE
        value: postgres
      - key: AGENTGUARD_ENV
        value: production
    envVarGroups:
      - name: agentguard-secrets
        envVars:
          - key: AGENTGUARD_API_KEY
            generateValue: true
          - key: AGENTGUARD_ADMIN_SECRET
            generateValue: true

databases:
  - name: agentguard-db
    databaseName: agentguard
    user: agentguard
    plan: free
