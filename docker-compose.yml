services:
  collector:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      AGENTGUARD_DB_TYPE: postgres
      DATABASE_URL: postgresql://agentguard:${POSTGRES_PASSWORD}@postgres:5432/agentguard

      AGENTGUARD_API_KEY: ${AGENTGUARD_API_KEY}
      AGENTGUARD_ADMIN_SECRET: ${AGENTGUARD_ADMIN_SECRET}
      AGENTGUARD_FLASK_SECRET: ${AGENTGUARD_FLASK_SECRET}

      AGENTGUARD_MAX_BODY_BYTES: "262144"
      AGENTGUARD_AUTH_SESSION_TTL: "900"
      AGENTGUARD_CORS_ORIGINS: ${AGENTGUARD_CORS_ORIGINS:-http://localhost:8080}

      AGENTGUARD_USE_ML: ${AGENTGUARD_USE_ML:-false}
      AGENTGUARD_USE_LLM_JUDGE: ${AGENTGUARD_USE_LLM_JUDGE:-false}
      AGENTGUARD_JUDGE_API_KEY: ${DEEPSEEK_API_KEY:-}
      AGENTGUARD_JUDGE_MODEL: ${AGENTGUARD_JUDGE_MODEL:-deepseek-chat}
      AGENTGUARD_ML_THRESHOLD: ${AGENTGUARD_ML_THRESHOLD:-0.85}
      AGENTGUARD_BLOCK_ON_AMBIGUOUS: ${AGENTGUARD_BLOCK_ON_AMBIGUOUS:-false}
      AGENTGUARD_DETECTOR_FAILURE_MODE: ${AGENTGUARD_DETECTOR_FAILURE_MODE:-fail_closed}

      AGENTGUARD_RATE_LIMIT: ${AGENTGUARD_RATE_LIMIT:-120 per minute}
      AGENTGUARD_SPAN_RATE_LIMIT: ${AGENTGUARD_SPAN_RATE_LIMIT:-30 per minute}
      AGENTGUARD_LIMITER_STORAGE: redis://redis:6379/0

      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - agentguard_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - agentguard_network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentguard
      POSTGRES_USER: agentguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguard -d agentguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - agentguard_network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - agentguard_network

volumes:
  agentguard_data:
  postgres_data:
  redis_data:

networks:
  agentguard_network:
    driver: bridge

