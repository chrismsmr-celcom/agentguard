version: "3.8"

services:
  collector:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AGENTGUARD_DB_TYPE=sqlite
      - AGENTGUARD_DB_PATH=/data/agentguard.db
      - AGENTGUARD_API_KEY=${AGENTGUARD_API_KEY:?Définis AGENTGUARD_API_KEY dans ton .env (voir .env.example)}
      - AGENTGUARD_ADMIN_SECRET=${AGENTGUARD_ADMIN_SECRET:-}
      - AGENTGUARD_FLASK_SECRET=${AGENTGUARD_FLASK_SECRET:-}
    volumes:
      - agentguard_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,os; urllib.request.urlopen(urllib.request.Request('http://localhost:8080/api/metrics', headers={'X-API-Key': os.environ['AGENTGUARD_API_KEY']}))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  agentguard_data:
