[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerbere-ag"
version = "0.2.1"
description = "Runtime security & observability guard for AI agents — intercepts LLM calls and tool calls before execution."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "Christopher Dikesa", email = "chris@agentguard.dev" }
]
keywords = ["ai", "agents", "security", "llm", "guardrails", "observability", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "structlog>=23.2.0,<25.0.0",
    "tiktoken>=0.7.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
signing = ["cryptography>=41.0.0,<45.0.0"]
pii = ["presidio-analyzer>=2.2.350,<3.0.0", "presidio-anonymizer>=2.2.350,<3.0.0"]
redis = ["redis>=5.0.0,<6.0.0"]
ml = ["torch>=2.1.0", "transformers>=4.36.0", "scikit-learn>=1.3.0"]

[project.urls]
Homepage = "https://app.cerbereag.site"
Repository = "https://github.com/chrismsmr-celcom/agentguard"

[tool.setuptools]
# Conserve ces modules racine si tu gardes les fichiers shim pour la rétrocompatibilité
py-modules = ["agentguard_sdk", "agentguard_ml"]

[tool.setuptools.packages.find]
# C'est LA ligne critique : elle force l'inclusion du dossier 'agentguard' 
# et de TOUS ses fichiers internes (y compris le nouveau patterns.py)
include = ["agentguard", "agentguard.*"]
